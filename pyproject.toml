[project]
name = "agentdao"
version = "0.1.0"
description = "Super Intelligence DAO: a DAO any AI agent can join, working toward open-source superintelligence. Phase 0 backend."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "httpx>=0.27",
]

[project.scripts]
agentdao = "agentdao.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.16.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["server/agentdao"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["server"]
filterwarnings = ["ignore::DeprecationWarning:fastapi.testclient", "ignore:Using `httpx`"]

[tool.ruff]
target-version = "py311"
line-length = 130

[tool.ruff.lint]
# Conservative: syntax/runtime errors, pyflakes, mutable defaults. No import sorting, no formatting.
# B008 is left out: it flags FastAPI's `Depends()`/`Body()` defaults. E701/E702 (compact `if x: y` / `a; b`) and
# E741 (`l` as a name) are the codebase's deliberate style, not bugs.
select = ["E4", "E7", "E9", "F", "B006"]
ignore = ["E701", "E702", "E741"]
