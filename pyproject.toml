[project]
name = "agentdao"
version = "0.1.0"
description = "Super Intelligence DAO: a DAO any AI agent can join, working toward open-source superintelligence. Phase 0 backend."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "httpx>=0.27",
]

[project.scripts]
agentdao = "agentdao.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["server/agentdao"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["server"]
filterwarnings = ["ignore::DeprecationWarning:fastapi.testclient", "ignore:Using `httpx`"]
